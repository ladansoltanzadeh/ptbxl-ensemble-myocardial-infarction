# =============================================================================
# environment.yml - Conda environment for ECG-MI Project
# =============================================================================
name: ecg_env
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch=2.0.1
  - torchvision=0.15.2
  - torchaudio=2.0.2
  - numpy=1.24.3
  - pandas=2.0.3
  - scikit-learn=1.3.0
  - scipy=1.10.1
  - matplotlib=3.7.2
  - seaborn=0.12.2
  - wfdb=4.1.0
  - tqdm=4.65.0
  - onnx=1.14.0
  - onnxruntime=1.15.1
  - onnxruntime-tools=1.7.0
  - protobuf=3.20.3
  - jupyter=1.0.0
  - ipykernel=6.25.0
  - ipywidgets=8.0.7
  - tensorboard=2.13.0
  - pip:
    - wfdb==4.1.0  # در صورت عدم وجود در conda-forge